name: Build
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - int

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: adopt
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: gradle/gradle-build-action@v3
      - run: ./gradlew build
